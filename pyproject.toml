[project]
name = "jasperloop-dv"
version = "0.1.0"
description = "JasperGold-in-the-loop AI design verification copilot for SVA generation, repair, triage, and coverage closure."
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.22,<5",
    "pydantic>=2.7,<3",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.5,<1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "adapters",
    "adapters.lean",
    "adapters.smt",
    "adapters.smt.cvc5",
    "adapters.smt.z3",
    "app",
    "app.core",
    "app.models",
    "app.retrieval",
    "copilot",
    "copilot.agents",
    "copilot.baselines",
    "core",
    "tools",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
ignore = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
