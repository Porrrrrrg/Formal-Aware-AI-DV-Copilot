name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  attestations: none
  contents: read
  id-token: none
  pull-requests: read
  security-events: write

env:
  JASPERLOOP_ALLOW_NETWORK: "false"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHON_VERSION: "3.11"

jobs:
  review-gate:
    name: Review gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Require human approval
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (pr.draft) {
              core.setFailed("Draft pull requests do not satisfy the merge review gate.");
              return;
            }

            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });

            const latestByReviewer = new Map();
            for (const review of reviews) {
              if (!review.user || review.user.type === "Bot") {
                continue;
              }
              latestByReviewer.set(review.user.login, review.state);
            }

            const approvals = [...latestByReviewer.entries()]
              .filter(([, state]) => state === "APPROVED")
              .map(([login]) => login);
            const changeRequests = [...latestByReviewer.entries()]
              .filter(([, state]) => state === "CHANGES_REQUESTED")
              .map(([login]) => login);

            if (changeRequests.length > 0) {
              core.setFailed(`Changes requested by: ${changeRequests.join(", ")}`);
              return;
            }
            if (approvals.length < 1) {
              core.setFailed("At least one non-bot approving review is required.");
              return;
            }
            core.info(`Review gate satisfied by: ${approvals.join(", ")}`);

  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color

  python-quality:
    name: Python lint and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install CI dependencies
        run: python -m pip install -e ".[dev]"

      - name: Ruff
        run: python -m ruff check .

      - name: Pytest
        run: python -m pytest

  tests-core:
    name: tests/core
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install CI dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run core tests
        run: |
          if [ -d tests/core ]; then
            python -m pytest tests/core
          else
            echo "tests/core not present on this integration branch; skipping focused core job."
          fi

  tests-adapters:
    name: tests/adapters
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install CI dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run adapter tests
        run: |
          if [ -d tests/adapters ]; then
            python -m pytest tests/adapters
          else
            echo "tests/adapters not present on this integration branch; skipping focused adapter job."
          fi

  tests-retrieval:
    name: tests/retrieval
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install CI dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run retrieval tests
        run: |
          if [ -d tests/retrieval ]; then
            python -m pytest tests/retrieval
          else
            echo "tests/retrieval not present on this integration branch; skipping focused retrieval job."
          fi

  tests-repo-contracts:
    name: tests/test_repo_contracts.py
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install CI dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run repo contract tests
        run: python -m pytest tests/test_repo_contracts.py

  core-schema-validation:
    name: schemas/v1/core.schema.json
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install CI dependencies
        run: python -m pip install -e ".[dev]"

      - name: Validate canonical core schema
        run: |
          if [ ! -f schemas/v1/core.schema.json ] || [ ! -f app/models/core.py ]; then
            echo "Canonical core schema not present on this integration branch; skipping schema parity job."
            exit 0
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          from app.models.core import core_schema_document

          schema_path = Path("schemas/v1/core.schema.json")
          schema = json.loads(schema_path.read_text())
          Draft202012Validator.check_schema(schema)
          if schema != core_schema_document():
            raise SystemExit(f"{schema_path} does not match app.models.core")
          print(f"valid schema: {schema_path}")
          PY

  schema-validation:
    name: Schema validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install schema validator
        run: python -m pip install -e ".[dev]"

      - name: Validate schema files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          schema_paths = sorted(Path("copilot/schemas").glob("*.schema.json"))
          core_schema_path = Path("schemas/v1/core.schema.json")
          if core_schema_path.exists():
            schema_paths.append(core_schema_path)
          if not schema_paths:
            raise SystemExit("No schema files found under copilot/schemas")
          for schema_path in schema_paths:
            schema = json.loads(schema_path.read_text())
            Draft202012Validator.check_schema(schema)
            print(f"valid schema: {schema_path}")
          PY

      - name: Build and validate evidence packets
        run: |
          mkdir -p artifacts/schema
          python scripts/build_all_evidence_packets.py --out-dir artifacts/schema/case_packets \
            > artifacts/schema/case_packets_summary.json
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          schema = json.loads(Path("copilot/schemas/evidence_packet.schema.json").read_text())
          validator = Draft202012Validator(schema)
          packet_paths = sorted(Path("artifacts/schema/case_packets").glob("*/*/evidence_packet.json"))
          if len(packet_paths) != 30:
            raise SystemExit(f"Expected 30 generated evidence packets, found {len(packet_paths)}")
          failures = []
          for packet_path in packet_paths:
            packet = json.loads(packet_path.read_text())
            errors = sorted(validator.iter_errors(packet), key=lambda err: list(err.path))
            if "gold_label" in packet:
              failures.append(f"{packet_path}: gold_label leaked into agent packet")
            for error in errors:
              location = ".".join(str(part) for part in error.path) or "<root>"
              failures.append(f"{packet_path}:{location}: {error.message}")
          if failures:
            raise SystemExit("\n".join(failures))
          print(f"validated {len(packet_paths)} generated evidence packets")
          PY

      - name: Upload schema artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schema-validation-artifacts
          path: artifacts/schema
          retention-days: 14

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for hard-coded secrets
        run: |
          mkdir -p artifacts/security
          python - <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          patterns = [
            ("private-key", re.compile(r"-----BEGIN (?:RSA |DSA |EC |OPENSSH |PGP )?PRIVATE KEY-----")),
            ("aws-access-key", re.compile(r"\bAKIA[0-9A-Z]{16}\b")),
            ("github-token", re.compile(r"\bgh[pousr]_[A-Za-z0-9_]{36,255}\b")),
            ("openai-api-key", re.compile(r"\bsk-[A-Za-z0-9]{20,}\b")),
            (
              "assigned-secret",
              re.compile(
                r"(?i)\b(api[_-]?key|secret|token|password)\b\s*[:=]\s*"
                r"['\"][A-Za-z0-9_./+=-]{24,}['\"]"
              ),
            ),
          ]
          skip_parts = {".git", ".mypy_cache", ".pytest_cache", ".ruff_cache", ".venv", "artifacts", "dist"}
          suffixes = {
            ".cfg",
            ".ini",
            ".json",
            ".md",
            ".py",
            ".sh",
            ".sv",
            ".tcl",
            ".toml",
            ".txt",
            ".yaml",
            ".yml",
          }
          findings = []
          for path in sorted(Path(".").rglob("*")):
            if not path.is_file() or any(part in skip_parts for part in path.parts):
              continue
            if path.suffix.lower() not in suffixes or path.stat().st_size > 1_000_000:
              continue
            text = path.read_text(errors="ignore")
            for line_no, line in enumerate(text.splitlines(), start=1):
              for rule_id, pattern in patterns:
                if pattern.search(line):
                  findings.append(
                    {
                      "rule_id": rule_id,
                      "path": str(path),
                      "line": line_no,
                      "message": f"Potential {rule_id} in repository text",
                    }
                  )

          sarif = {
            "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
            "version": "2.1.0",
            "runs": [
              {
                "tool": {
                  "driver": {
                    "name": "jasperloop-secret-scan",
                    "informationUri": "https://docs.github.com/code-security/secret-scanning",
                    "rules": [
                      {
                        "id": rule_id,
                        "shortDescription": {"text": rule_id},
                        "help": {"text": "Remove hard-coded secrets and rotate exposed credentials."},
                      }
                      for rule_id in sorted({finding["rule_id"] for finding in findings} or {"no-findings"})
                    ],
                  }
                },
                "results": [
                  {
                    "ruleId": finding["rule_id"],
                    "level": "error",
                    "message": {"text": finding["message"]},
                    "locations": [
                      {
                        "physicalLocation": {
                          "artifactLocation": {"uri": finding["path"]},
                          "region": {"startLine": finding["line"]},
                        }
                      }
                    ],
                  }
                  for finding in findings
                ],
              }
            ],
          }
          Path("artifacts/security/secret-scan.sarif").write_text(json.dumps(sarif, indent=2) + "\n")
          Path("artifacts/security/secret-scan.json").write_text(json.dumps(findings, indent=2) + "\n")
          if findings:
            for finding in findings:
              print(f"{finding['path']}:{finding['line']}: {finding['message']}", file=sys.stderr)
            raise SystemExit(1)
          print("No high-confidence secret patterns found.")
          PY

      - name: Upload secret scan SARIF
        if: always() && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: artifacts/security/secret-scan.sarif
          category: jasperloop-secret-scan

      - name: Upload secret scan artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan-artifacts
          path: artifacts/security
          retention-days: 14

  smoke:
    name: Adapter and benchmark smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs:
      - python-quality
      - schema-validation
      - tests-core
      - tests-adapters
      - tests-retrieval
      - tests-repo-contracts
      - core-schema-validation
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install smoke dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run deterministic smoke suite
        run: |
          mkdir -p artifacts/smoke
          python evaluation/run_eval.py \
            --cases benchmarks/arbiter_rr2/cases benchmarks/rv_buffer/cases benchmarks/apb_regblock/cases \
            > artifacts/smoke/run_eval_summary.json
          python evaluation/run_agent_eval.py \
            --all-systems \
            --packet-source minimal \
            --out artifacts/smoke/agent_eval.json \
            > artifacts/smoke/agent_eval_summary.json
          python evaluation/run_coverage_eval.py \
            --all-systems \
            --packet-source minimal \
            --out artifacts/smoke/coverage_eval.json \
            > artifacts/smoke/coverage_eval_summary.json
          python evaluation/run_sva_eval.py \
            --limit 3 \
            --out artifacts/smoke/sva_eval.json \
            > artifacts/smoke/sva_eval_summary.json
          python evaluation/run_sva_repair_eval.py \
            --limit 3 \
            --max-rounds 1 \
            --jasper-dry-run \
            --out artifacts/smoke/sva_repair_dry_run.json \
            > artifacts/smoke/sva_repair_dry_run_summary.json

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-smoke-results
          path: artifacts/smoke
          retention-days: 14

  codeql:
    name: CodeQL
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3

  attest-ci-artifacts:
    name: Attest CI artifacts
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs:
      - smoke
      - secret-scan
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Download smoke artifact
        uses: actions/download-artifact@v4
        with:
          name: ci-smoke-results
          path: attest/ci-smoke-results

      - name: Attest smoke artifact provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: attest/ci-smoke-results/**
