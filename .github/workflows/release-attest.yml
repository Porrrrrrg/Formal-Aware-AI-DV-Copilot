name: Release Attestation

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to package. Leave empty for the workflow ref.
        required: false
        type: string

concurrency:
  group: release-attest-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  attestations: write
  contents: read
  id-token: write
  security-events: none

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHON_VERSION: "3.11"

jobs:
  release-attest:
    name: Validate and attest release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install release validation dependencies
        run: python -m pip install -e ".[dev]" ruff

      - name: Release validation gate
        run: |
          python -m ruff check .
          python -m pytest
          mkdir -p artifacts/release-validation
          python scripts/build_all_evidence_packets.py \
            --out-dir artifacts/release-validation/case_packets \
            > artifacts/release-validation/case_packets_summary.json
          python evaluation/run_agent_eval.py \
            --all-systems \
            --packet-source minimal \
            --out artifacts/release-validation/agent_eval.json \
            > artifacts/release-validation/agent_eval_summary.json
          python evaluation/run_sva_eval.py \
            --limit 3 \
            --out artifacts/release-validation/sva_eval.json \
            > artifacts/release-validation/sva_eval_summary.json

      - name: Build release bundle
        run: |
          mkdir -p dist/release
          short_sha="$(git rev-parse --short=12 HEAD)"
          bundle="dist/release/jasperloop-dv-${short_sha}.tar.gz"
          git archive --format=tar.gz --output="${bundle}" HEAD
          sha256sum "${bundle}" > "${bundle}.sha256"
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          bundle = next(Path("dist/release").glob("jasperloop-dv-*.tar.gz"))
          manifest = {
            "repository": os.environ.get("GITHUB_REPOSITORY"),
            "ref": os.environ.get("GITHUB_REF"),
            "sha": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
            "bundle": str(bundle),
            "sha256_file": str(bundle) + ".sha256",
            "workflow_run": os.environ.get("GITHUB_RUN_ID"),
          }
          Path("dist/release/release-manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          PY

      - name: Upload release attestation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-attestation-inputs
          path: |
            dist/release
            artifacts/release-validation
          retention-days: 90

      - name: Attest release bundle provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/release/**
